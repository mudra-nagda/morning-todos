name: Morning todos

on:
  schedule:
    - cron: '0 15 * * *' # 8am Pacific during daylight time
    - cron: '0 16 * * *' # 8am Pacific during standard time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-todos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: gate
        run: node scripts/gate.mjs
        env:
          EVENT: ${{ github.event_name }}

      - if: steps.gate.outputs.run == 'true'
        run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.BUMBLEBEE_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          TODO_PASSPHRASE: ${{ secrets.TODO_PASSPHRASE }}
          REPOS: kognitos/bumblebee

      # Only the timestamp is committed (it's what the gate reads); the todos
      # themselves exist only inside the deployed, encrypted Pages artifact.
      - if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "morning-todos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json
          git diff --cached --quiet || (git commit -m "chore: refresh todos" && git push)

      # Stamp this deploy's version on the page's files so browsers never mix old and new code.
      - if: steps.gate.outputs.run == 'true'
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" site/index.html site/app.js

      - if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: steps.gate.outputs.run == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
