<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Morning list</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1 id="today">Morning list</h1>
      <p class="sub"><span id="refreshed"></span><span id="progress"></span><button id="hide-done" class="link" hidden></button></p>
      <p class="views" id="views" hidden><button data-view="list">List</button><button data-view="shapes">Shapes</button></p>
    </header>
    <p class="notice" id="notice" hidden></p>
    <div id="list"></div>

    <form id="unlock" hidden>
      <p>Enter your passphrase to see today's list.</p>
      <input type="password" id="passphrase" autocomplete="current-password" placeholder="Passphrase" required>
      <button type="submit" id="unlock-btn">Unlock</button>
      <p class="error" id="unlock-error" role="alert"></p>
    </form>
  </main>

  <section id="shapes" hidden>
    <div id="score" aria-label="Done today"></div>
    <div class="upper">
      <div class="track">
        <div id="front"></div>
        <div id="line" aria-label="Up next"></div>
      </div>
      <div id="focus"></div>
    </div>
    <div class="lower">
      <svg id="field" role="group" aria-label="Your groups"></svg>
      <div id="labels"></div>
      <button id="add-group" title="Add a group" aria-label="Add a group">+</button>
    </div>
  </section>
  <div id="card" role="dialog" aria-label="Todo details" hidden></div>

  <div id="selbar" role="toolbar" aria-label="Selected text" hidden>
    <button data-action="done">Tick off</button>
    <button data-action="split">Split out</button>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
